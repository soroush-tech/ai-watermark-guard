sonar.projectKey=soroush-tech_ai-watermark-guard
sonar.organization=soroush-tech

# Rust is one of the three languages SonarQube Cloud's Automatic Analysis does not cover (with
# Objective-C and Dart), so this project is analysed from CI - see the `sonar` job in ci.yml.
# Automatic Analysis has to stay off: with both enabled, the CI analysis fails.

sonar.sources=src,npm
sonar.tests=src,tests

# Unit tests are split out beside the code they cover as *_test.rs, and the end-to-end suite lives
# in tests/. Declaring both as tests - and excluding the split-out ones from sources - keeps their
# fixtures from being read as production code, where repeated setup between tests reads as
# duplication to answer for.
sonar.test.inclusions=src/**/*_test.rs,tests/**/*.rs
sonar.exclusions=target/**,npm/dist/**,src/**/*_test.rs

sonar.sourceEncoding=UTF-8

# Both files are produced by the `sonar` job before the scan runs.
#
# The analyser can run Clippy itself when it finds Cargo.toml, but it does that inside its own
# container. Importing a report built by this repository's toolchain and its own lint
# configuration is deterministic, and means Sonar sees exactly what CI enforces.
sonar.rust.clippy.enabled=false
sonar.rust.clippy.reportPaths=clippy-report.json
sonar.rust.lcov.reportPaths=lcov.info
