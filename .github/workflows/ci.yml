name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The message-range tests need history to name, not just the tip.
          fetch-depth: 0

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- --deny warnings

      - name: Test
        run: cargo test --all-targets

  # The guard runs against its own repository. Its tables are code points, so a clean result here
  # means the crate holds none of the characters it bans.
  self:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        run: cargo build --release

      - name: Guard this repository
        run: ./target/release/aiwg --all
